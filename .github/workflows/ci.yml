name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PersonalAI.sln

      - name: Build
        run: dotnet build PersonalAI.sln --configuration Release --no-restore

      - name: Smoke test memory, RAG quality and internal tools
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "Smoke test failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR
          export PERSONALAI_DEV_SECRET="ci-parent-secret-140"
          rm -rf /tmp/personalai-workspace /tmp/personalai-tasks /tmp/personalai-audit /tmp/personalai-undo /tmp/personalai-connectors /tmp/personalai-companion /tmp/personalai-life-context /tmp/personalai-automation
          mkdir -p /tmp/personalai-workspace/notes
          printf 'Workspace root file.\n' >/tmp/personalai-workspace/readme.txt
          printf 'Workspace alpha secure file tool content.\nSecond line.\n' >/tmp/personalai-workspace/notes/plan.md
          printf '\0binary payload' >/tmp/personalai-workspace/binary.bin
          ln -s /tmp /tmp/personalai-workspace/escape

          Workspace__Root=/tmp/personalai-workspace Tasks__Root=/tmp/personalai-tasks Audit__Root=/tmp/personalai-audit Undo__Root=/tmp/personalai-undo Connectors__Root=/tmp/personalai-connectors Companion__Root=/tmp/personalai-companion Companion__AllowInsecureHttp=true LifeContext__Root=/tmp/personalai-life-context Automation__Root=/tmp/personalai-automation dotnet run --project src/PersonalAI.Web/PersonalAI.Web.csproj --configuration Release --no-build --urls http://127.0.0.1:5077 >/tmp/personalai.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5077/api/memory >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/personalai.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:5077/api/status | jq -e '.version == "2.1.1"' >/dev/null

          curl -fsS -D /tmp/status-headers http://127.0.0.1:5077/api/status -o /tmp/status-body.json
          grep -Eiq '^X-PersonalAI-Request-Id: [a-f0-9]{32}' /tmp/status-headers
          grep -Eiq '^X-PersonalAI-Api-Version: 1' /tmp/status-headers
          grep -Eiq '^X-Content-Type-Options: nosniff' /tmp/status-headers
          jq -e '.version == "2.1.1" and .apiContractVersion == "1" and .channel == "controlled"' /tmp/status-body.json >/dev/null

          capabilities=$(curl -fsS http://127.0.0.1:5077/api/system/capabilities)
          echo "$capabilities" | jq -e '
            . as $caps
            | .version == "2.1.1"
            and .apiContractVersion == "1"
            and .channel == "controlled"
            and .workspaceHeader == "X-PersonalAI-Workspace"
            and .requestIdHeader == "X-PersonalAI-Request-Id"
            and all(
              ["workspace","memory","documents","rag","tasks","files","context","tools","audit","undo","hardening","conversations"][];
              . as $module | ($caps.stableModules | index($module)) != null
            )
          ' >/dev/null
          echo "$capabilities" | jq -e '
            all(.reservedModules[]; . != "agents")
            and any(.reservedModules[]; . == "policies")
            and .controlledModules == ["computer-use","browser-agent","connectors","software-development","android-companion","life-context","decision-engine","automation","agents"]
            and all(.reservedModules[]; . != "browser")
            and all(.reservedModules[]; . != "browser-agent")
            and all(.reservedModules[]; . != "computer-use")
            and all(.reservedModules[]; . != "connectors")
            and all(.reservedModules[]; . != "software-development")
            and all(.reservedModules[]; . != "android-companion")
            and all(.reservedModules[]; . != "life-context")
            and all(.reservedModules[]; . != "decision-engine")
            and all(.reservedModules[]; . != "automation")
            and .safety.workspaceIsolation == true
            and .safety.writeRequiresConfirmation == true
            and .safety.deleteRequiresConfirmation == true
            and .safety.externalRequiresConfirmation == true
            and .safety.undoRequiresConfirmation == true
            and .safety.computerControlRequiresConfirmation == true
            and .safety.sensitiveComputerObservationRequiresConfirmation == true
            and .safety.browserUseRequiresConfirmation == true
            and .safety.browserPrivateNetworkAccess == false
            and .safety.browserSideEffectsEnabled == false
            and .safety.connectorUseRequiresConfirmation == true
            and .safety.connectorSecretsEncrypted == true
            and .safety.connectorWriteActionsEnabled == false
            and .safety.developmentUseRequiresConfirmation == true
            and .safety.developmentArbitraryShellEnabled == false
            and .safety.developmentGitWriteActionsEnabled == false
            and .safety.developmentArbitraryProcessEnabled == false
            and .safety.companionPairingRequired == true
            and .safety.companionDeviceTokensHashed == true
            and .safety.companionRemoteToolExecutionEnabled == false
            and .safety.companionRemoteTaskMutationEnabled == false
            and .safety.lifeContextExplicitConsentRequired == true
            and .safety.lifeContextAutomaticCollectionEnabled == false
            and .safety.lifeContextContentEncrypted == true
            and .safety.decisionEngineRequiresUserDecision == true
            and .safety.decisionEngineAutoActionEnabled == false
            and .safety.decisionEngineToolExecutionEnabled == false
            and .safety.decisionEnginePersistsAnalyses == false
            and .safety.automationRequiresExplicitCreation == true
            and .safety.automationAutoConfirmationEnabled == false
            and .safety.automationDecisionRecommendationAutoExecutionEnabled == false
            and .safety.automationRunsAtMostOneTaskStepPerTick == true
            and .safety.agentFrameworkRequiresExplicitInvocation == true
            and .safety.agentToolExecutionEnabled == false
            and .safety.automaticAgentDelegationEnabled == false
            and .safety.agentMessagingEnabled == false
            and .safety.parallelAgentExecutionEnabled == false
            and .safety.plannerCreatesTasks == false
            and .safety.plannerDispatchesAgents == false
            and .safety.plannerPersistsPlans == false
            and .safety.automaticMultiStepExecution == false
            and .safety.backgroundScheduler == true
            and .safety.autonomousAgentLoop == false
            and .safety.parallelToolCalls == false
            and .limits.maximumWorkspaces == 20
            and .limits.maximumTasksPerWorkspace == 50
            and .limits.maximumContextCharacters == 7600
            and .limits.maximumWorkspaceFileBytes == 524288
            and .limits.auditRetentionDays == 90
            and .limits.maximumAuditEntries == 10000
            and .limits.undoAvailabilityDays == 7
            and .limits.maximumUndoEntries == 500
            and .limits.maximumUndoSnapshotBytes == 524288
            and .limits.browserMaximumResponseBytes == 1048576
            and .limits.browserMaximumPageTextCharacters == 24000
            and .limits.browserMaximumLinks == 100
            and .limits.browserMaximumRedirects == 5
            and .limits.maximumConnectorConnections == 20
            and .limits.connectorMaximumResponseBytes == 524288
            and .limits.connectorMaximumReturnedCharacters == 32000
            and .limits.connectorMaximumRedirects == 3
            and .limits.developmentMaximumScannedFiles == 2000
            and .limits.developmentMaximumSearchHits == 100
            and .limits.developmentMaximumProcessOutputCharacters == 48000
            and .limits.companionMaximumDevicesPerWorkspace == 10
            and .limits.companionPairingLifetimeMinutes == 5
            and .limits.lifeContextMaximumSourcesPerWorkspace == 20
            and .limits.lifeContextMaximumEntriesPerWorkspace == 1000
            and .limits.lifeContextMaximumContentCharacters == 2000
            and .limits.lifeContextMaximumRetentionDays == 365
            and .limits.decisionMaximumQuestionCharacters == 4000
            and .limits.decisionMaximumOptions == 8
            and .limits.decisionMaximumCriteria == 8
            and .limits.maximumAutomationsPerWorkspace == 50
            and .limits.automationMinimumIntervalMinutes == 5
            and .limits.automationMaximumIntervalMinutes == 10080
            and .limits.automationSchedulerPollSeconds == 30
            and .limits.maximumAgentGoalCharacters == 4000
            and .limits.maximumAgentConversationMessages == 20
            and .limits.maximumConcurrentAgentExecutions == 1
            and .limits.minimumPlannerSteps == 2
            and .limits.maximumPlannerSteps == 12
            and .limits.maximumPlannerOpenQuestions == 8
            and .limits.maximumPlannerAssumptions == 8
            and .limits.maximumPlannerRisks == 8
          ' >/dev/null

          core_health=$(curl -fsS http://127.0.0.1:5077/api/system/health)
          echo "$core_health" | jq -e '
            .version == "2.1.1"
            and .apiContractVersion == "1"
            and .channel == "controlled"
            and .ready == true
            and .workspaceId == "personal"
            and (.status == "healthy" or .status == "degraded")
            and any(.modules[]; .module == "workspace" and .status == "healthy")
            and any(.modules[]; .module == "memory" and .status == "healthy")
            and any(.modules[]; .module == "documents" and .status == "healthy")
            and any(.modules[]; .module == "tasks" and .status == "healthy")
            and any(.modules[]; .module == "files" and .status == "healthy")
            and any(.modules[]; .module == "tools" and .status == "healthy")
            and any(.modules[]; .module == "audit" and .status == "healthy")
            and any(.modules[]; .module == "undo" and .status == "healthy")
            and any(.modules[]; .module == "hardening" and (.status == "healthy" or .status == "degraded"))
            and any(.modules[]; .module == "computer-use" and .status == "unconfigured")
            and any(.modules[]; .module == "browser-agent" and .status == "healthy")
            and any(.modules[]; .module == "connectors" and .status == "healthy")
            and any(.modules[]; .module == "software-development" and (.status == "healthy" or .status == "unconfigured"))
            and any(.modules[]; .module == "android-companion" and .status == "healthy")
            and any(.modules[]; .module == "life-context" and .status == "healthy")
            and any(.modules[]; .module == "decision-engine" and .status == "healthy")
            and any(.modules[]; .module == "automation" and .status == "healthy")
            and any(.modules[]; .module == "agents" and .status == "healthy" and .itemCount == 2)
            and any(.modules[]; .module == "ai-provider" and (.status == "healthy" or .status == "unconfigured"))
          ' >/dev/null

          hardening_status=$(curl -fsS http://127.0.0.1:5077/api/hardening/status)
          echo "$hardening_status" | jq -e '
            .version == "2.1.1"
            and (.status == "healthy" or .status == "degraded")
            and .runtime.running == true
            and .permissionAudit.violationCount == 0
            and .maximumApiRequestsPerMinute == 600
            and .maximumConcurrentApiRequests == 16
            and .maximumApiRequestBytes == 12582912
            and .maximumBackupCount == 5
            and .maximumBackupSourceBytes == 536870912
            and .crossProcessMaintenanceLock == true
          ' >/dev/null

          permission_audit=$(curl -fsS http://127.0.0.1:5077/api/hardening/permissions)
          echo "$permission_audit" | jq -e '
            .status == "healthy"
            and .toolCount > 0
            and .riskyToolCount > 0
            and .violationCount == 0
            and all(.findings[]; .confirmationBlockedWithoutUserApproval == true)
          ' >/dev/null

          backup_denied_code=$(curl -sS -o /tmp/hardening-backup-denied.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/hardening/backups             -H 'Content-Type: application/json'             -d '{"confirmed":false}')
          test "$backup_denied_code" = "403"

          hardening_backup=$(curl -fsS -X POST http://127.0.0.1:5077/api/hardening/backups -H 'Content-Type: application/json' -d '{"confirmed":true}')
          echo "$hardening_backup" | jq -e '.backupId | endswith(".zip")' >/dev/null
          echo "$hardening_backup" | jq -e '.sizeBytes > 0 and .fileCount >= 0 and .version == "2.1.1"' >/dev/null
          hardening_backup_id=$(echo "$hardening_backup" | jq -r '.backupId')
          hardening_backups=$(curl -fsS http://127.0.0.1:5077/api/hardening/backups)
          echo "$hardening_backups" | jq -e '.maximum == 5 and .pendingRestore == false and any(.backups[]; .backupId == "'"$hardening_backup_id"'")' >/dev/null

          restore_missing_code=$(curl -sS -o /tmp/hardening-restore-missing.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/hardening/restore -H 'Content-Type: application/json' -d '{"backupId":"missing.zip","confirmed":true}')
          test "$restore_missing_code" = "400"

          restore_denied_code=$(curl -sS -o /tmp/hardening-restore-denied.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/hardening/restore             -H 'Content-Type: application/json'             -d '{"backupId":"missing.zip","confirmed":false}')
          test "$restore_denied_code" = "403"

          os_status=$(curl -fsS http://127.0.0.1:5077/api/os/status)
          echo "$os_status" | jq -e '
            .version == "2.1.1"
            and .apiContractVersion == "1"
            and .edition == "Personal AI OS"
            and .stage == "v2.1.1"
            and .workspaceId == "personal"
            and .readiness.osContractReady == true
            and .readiness.readyForV21Foundation == true
            and .readiness.capabilityCount == 19
            and .governance.workspaceIsolation == true
            and .governance.permissionPolicy == true
            and .governance.explicitConfirmationForSideEffects == true
            and .governance.audit == true
            and .governance.undo == true
            and .governance.hardening == true
            and .governance.backupRestore == true
            and .governance.autonomousAgentLoop == false
            and .governance.parallelToolCalls == false
            and .governance.multiAgentFramework == true
            and .governance.agentOrchestration == false
            and .nextStage == "v2.1.2-research-agent"
            and any(.capabilities[]; .id == "memory" and .state == "ready")
            and any(.capabilities[]; .id == "browser" and .state == "controlled")
            and any(.capabilities[]; .id == "email" and .state == "foundation")
            and any(.capabilities[]; .id == "calendar" and .state == "foundation")
            and any(.capabilities[]; .id == "agent-framework" and .state == "controlled")
            and any(.capabilities[]; .id == "desktop" and (.state == "unconfigured" or .state == "controlled"))
          ' >/dev/null

          os_manifest=$(curl -fsS http://127.0.0.1:5077/api/os/manifest)
          echo "$os_manifest" | jq -e '
            .version == "2.1.1"
            and .edition == "Personal AI OS"
            and .stage == "v2.1.1"
            and (.layers | length) == 6
            and (.capabilities | length) == 19
            and any(.layers[]; .id == "knowledge" and (.capabilityIds | index("memory")) != null and (.capabilityIds | index("knowledge")) != null)
            and any(.layers[]; .id == "interfaces" and (.capabilityIds | index("email")) != null and (.capabilityIds | index("calendar")) != null)
            and any(.layers[]; .id == "coordination" and (.capabilityIds | index("agent-framework")) != null)
            and any(.boundaries[]; contains("explicit"))
            and any(.boundaries[]; contains("agent-to-agent"))
            and any(.boundaries[]; contains("Gmail/Outlook"))
          ' >/dev/null

          custom_os_status=$(curl -fsS -H 'X-PersonalAI-Workspace: work' http://127.0.0.1:5077/api/os/status)
          echo "$custom_os_status" | jq -e '.workspaceId == "work" and .version == "2.1.1"' >/dev/null

          agent_status=$(curl -fsS http://127.0.0.1:5077/api/agents/status)
          echo "$agent_status" | jq -e '
            .version == "2.1.1"
            and .frameworkVersion == "2.1.1"
            and .registeredAgents == 2
            and .maximumGoalCharacters == 4000
            and .maximumConversationMessages == 20
            and .maximumConcurrentExecutions == 1
            and .automaticDelegationEnabled == false
            and .agentMessagingEnabled == false
            and .sharedTaskQueueEnabled == false
            and .parallelAgentExecutionEnabled == false
            and .toolExecutionEnabled == false
            and .nextStage == "v2.1.2-research-agent"
          ' >/dev/null

          agent_catalog=$(curl -fsS http://127.0.0.1:5077/api/agents)
          echo "$agent_catalog" | jq -e '
            .version == "2.1.1"
            and .frameworkVersion == "2.1.1"
            and (.agents | length) == 2
            and any(.agents[];
              .id == "core.personal-assistant"
              and .role == "general-assistant"
              and .usesAiProvider == true
              and .toolExecutionEnabled == false
              and .requiresExplicitInvocation == true
              and (.tools | sort) == (["local.clock","local.text_stats"] | sort)
              and (.contextKinds | sort) == (["memory","knowledge","tasks","life-context"] | sort)
            )
            and any(.agents[];
              .id == "planning.planner"
              and .role == "planner"
              and .usesAiProvider == true
              and .toolExecutionEnabled == false
              and .requiresExplicitInvocation == true
              and .tools == []
              and any(.capabilities[]; . == "goal-decomposition")
              and any(.capabilities[]; . == "dependency-analysis")
              and any(.capabilities[]; . == "risk-identification")
              and (.contextKinds | sort) == (["memory","knowledge","tasks","life-context"] | sort)
            )
          ' >/dev/null

          planner_status=$(curl -fsS http://127.0.0.1:5077/api/planner/status)
          echo "$planner_status" | jq -e '
            .version == "2.1.1"
            and .agentId == "planning.planner"
            and .minimumSteps == 2
            and .maximumSteps == 12
            and .maximumOpenQuestions == 8
            and .maximumAssumptions == 8
            and .maximumRisks == 8
            and .structuredOutput == true
            and .createsTasks == false
            and .dispatchesAgents == false
            and .persistsPlans == false
            and .toolExecutionEnabled == false
            and .requiresExplicitInvocation == true
            and .nextStage == "v2.1.2-research-agent"
            and any(.suggestedRoles[]; . == "research")
            and any(.suggestedRoles[]; . == "developer")
            and any(.suggestedRoles[]; . == "reviewer")
          ' >/dev/null

          planner_agent=$(curl -fsS http://127.0.0.1:5077/api/agents/planning.planner)
          echo "$planner_agent" | jq -e '
            .id == "planning.planner"
            and .name == "Planner Agent"
            and .role == "planner"
            and .toolExecutionEnabled == false
            and .requiresExplicitInvocation == true
            and .tools == []
            and any(.capabilities[]; . == "goal-decomposition")
          ' >/dev/null

          planner_empty_goal_code=$(curl -sS -o /tmp/planner-empty-goal.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/agents/planning.planner/execute             -H 'Content-Type: application/json'             -d '{"goal":""}')
          test "$planner_empty_goal_code" = "400"
          jq -e '(.error | contains("không được để trống"))' /tmp/planner-empty-goal.json >/dev/null

          agent_empty_goal_code=$(curl -sS -o /tmp/agent-empty-goal.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/agents/core.personal-assistant/execute             -H 'Content-Type: application/json'             -d '{"goal":""}')
          test "$agent_empty_goal_code" = "400"
          jq -e '(.error | contains("không được để trống"))' /tmp/agent-empty-goal.json >/dev/null

          agent_missing_code=$(curl -sS -o /tmp/agent-missing.json -w '%{http_code}' http://127.0.0.1:5077/api/agents/not.real-agent)
          test "$agent_missing_code" = "404"

          workspaces=$(curl -fsS http://127.0.0.1:5077/api/workspaces)
          echo "$workspaces" | jq -e '.currentWorkspaceId == "personal" and .maximumWorkspaces == 20 and (.workspaces | length) >= 5 and any(.workspaces[]; .id == "personal" and .isBuiltIn == true) and any(.workspaces[]; .id == "work") and any(.workspaces[]; .id == "study") and any(.workspaces[]; .id == "ai-ca-nhan") and any(.workspaces[]; .id == "travel")' >/dev/null

          custom_workspace=$(curl -fsS -X POST http://127.0.0.1:5077/api/workspaces \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Workspace","description":"Không gian thử nghiệm v0.9.4"}')
          custom_workspace_id=$(echo "$custom_workspace" | jq -r '.id')
          test -n "$custom_workspace_id"
          echo "$custom_workspace" | jq -e '.isBuiltIn == false and (.activeModules | sort) == (["memory","documents","tasks","files","conversations","agents"] | sort) and (.reservedModules | sort) == (["policies"] | sort)' >/dev/null

          custom_status=$(curl -fsS -H "X-PersonalAI-Workspace: $custom_workspace_id" http://127.0.0.1:5077/api/status)
          echo "$custom_status" | jq -e '.version == "2.1.1" and .workspaceName == "CI Workspace"' >/dev/null

          custom_core_health=$(curl -fsS -H "X-PersonalAI-Workspace: $custom_workspace_id" http://127.0.0.1:5077/api/system/health)
          echo "$custom_core_health" | jq -e '.ready == true and .workspaceId == "'"$custom_workspace_id"'" and any(.modules[]; .module == "files" and .status == "healthy")' >/dev/null

          invalid_workspace_code=$(curl -sS -D /tmp/workspace-invalid-headers -o /tmp/workspace-invalid.json -w '%{http_code}' \
            -H 'X-PersonalAI-Workspace: does-not-exist' \
            http://127.0.0.1:5077/api/status)
          test "$invalid_workspace_code" = "400"
          jq -e '(.error | contains("không tồn tại"))' /tmp/workspace-invalid.json >/dev/null
          grep -Eiq '^X-PersonalAI-Request-Id: [a-f0-9]{32}' /tmp/workspace-invalid-headers
          grep -Eiq '^X-PersonalAI-Api-Version: 1' /tmp/workspace-invalid-headers

          custom_memory=$(curl -fsS -X POST http://127.0.0.1:5077/api/memory \
            -H "X-PersonalAI-Workspace: $custom_workspace_id" \
            -H 'Content-Type: application/json' \
            -d '{"kind":"fact","content":"workspace-ci-secret-094"}')
          echo "$custom_memory" | jq -e '.workspaceId == "'"$custom_workspace_id"'" and .content == "workspace-ci-secret-094"' >/dev/null
          personal_memories=$(curl -fsS http://127.0.0.1:5077/api/memory)
          echo "$personal_memories" | jq -e 'all(.[]; .content != "workspace-ci-secret-094")' >/dev/null
          custom_memories=$(curl -fsS -H "X-PersonalAI-Workspace: $custom_workspace_id" http://127.0.0.1:5077/api/memory)
          echo "$custom_memories" | jq -e 'any(.[]; .content == "workspace-ci-secret-094")' >/dev/null

          printf 'workspace scoped document 094\n' >/tmp/workspace-094.txt
          custom_document=$(curl -fsS -X POST http://127.0.0.1:5077/api/knowledge/documents \
            -H "X-PersonalAI-Workspace: $custom_workspace_id" \
            -F 'file=@/tmp/workspace-094.txt;type=text/plain')
          custom_document_id=$(echo "$custom_document" | jq -r '.id')
          test -n "$custom_document_id"
          custom_documents=$(curl -fsS -H "X-PersonalAI-Workspace: $custom_workspace_id" http://127.0.0.1:5077/api/knowledge/documents)
          echo "$custom_documents" | jq -e 'any(.[]; .fileName == "workspace-094.txt")' >/dev/null
          personal_documents=$(curl -fsS http://127.0.0.1:5077/api/knowledge/documents)
          echo "$personal_documents" | jq -e 'all(.[]; .fileName != "workspace-094.txt")' >/dev/null

          custom_task=$(curl -fsS -X POST http://127.0.0.1:5077/api/tasks/prepare \
            -H "X-PersonalAI-Workspace: $custom_workspace_id" \
            -H 'Content-Type: application/json' \
            -d '{"goal":"Kiểm tra task theo workspace","plan":"Đọc giờ cục bộ.","steps":[{"title":"Đọc giờ","description":"Đọc giờ hệ thống.","toolName":"local.clock","arguments":{}}]}')
          custom_task_id=$(echo "$custom_task" | jq -r '.id')
          echo "$custom_task" | jq -e '.workspaceId == "'"$custom_workspace_id"'"' >/dev/null
          custom_tasks=$(curl -fsS -H "X-PersonalAI-Workspace: $custom_workspace_id" http://127.0.0.1:5077/api/tasks)
          echo "$custom_tasks" | jq -e 'any(.tasks[]; .id == "'"$custom_task_id"'")' >/dev/null
          personal_tasks=$(curl -fsS http://127.0.0.1:5077/api/tasks)
          echo "$personal_tasks" | jq -e 'all(.tasks[]; .id != "'"$custom_task_id"'")' >/dev/null

          companion_status=$(curl -fsS http://127.0.0.1:5077/api/companion/status)
          echo "$companion_status" | jq -e '.version == "2.1.1" and .enabled == true and .secureTransportRequired == false and .maximumDevicesPerWorkspace == 10 and .pairingLifetimeMinutes == 5 and any(.capabilities[]; . == "chat") and any(.capabilities[]; . == "tasks-read")' >/dev/null

