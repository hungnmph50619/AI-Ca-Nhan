name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PersonalAI.sln

      - name: Build
        run: dotnet build PersonalAI.sln --configuration Release --no-restore

      - name: Smoke test memory, RAG quality and internal tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/personalai-workspace
          mkdir -p /tmp/personalai-workspace/notes
          printf 'Workspace root file.\n' >/tmp/personalai-workspace/readme.txt
          printf 'Workspace alpha secure file tool content.\nSecond line.\n' >/tmp/personalai-workspace/notes/plan.md
          printf '\0binary payload' >/tmp/personalai-workspace/binary.bin
          ln -s /tmp /tmp/personalai-workspace/escape

          Workspace__Root=/tmp/personalai-workspace dotnet run --project src/PersonalAI.Web/PersonalAI.Web.csproj --configuration Release --no-build --urls http://127.0.0.1:5077 >/tmp/personalai.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5077/api/memory >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/personalai.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:5077/api/status | jq -e '.version == "0.8.8"' >/dev/null

          tools=$(curl -fsS http://127.0.0.1:5077/api/tools)
          echo "$tools" | jq -e '.frameworkVersion == "0.8.8" and (.permissionTypes | sort) == (["DELETE","EXTERNAL","READ","SENSITIVE","WRITE"] | sort)' >/dev/null
          echo "$tools" | jq -e '(.tools | length) == 13 and any(.tools[]; .name == "local.clock" and .localOnly == true and .requiredPermissions == ["READ"]) and any(.tools[]; .name == "local.text_stats" and .timeoutMs == 2000) and any(.tools[]; .name == "memory.search") and any(.tools[]; .name == "documents.search") and any(.tools[]; .name == "local.calculate") and any(.tools[]; .name == "local.date_math") and any(.tools[]; .name == "app.summary") and any(.tools[]; .name == "workspace.list" and .requiredPermissions == ["READ"]) and any(.tools[]; .name == "workspace.read_text" and .requiredPermissions == ["READ"]) and any(.tools[]; .name == "workspace.write_text" and .requiredPermissions == ["WRITE"] and .requiresConfirmation == true) and any(.tools[]; .name == "workspace.create_directory" and .requiredPermissions == ["WRITE"] and .requiresConfirmation == true) and any(.tools[]; .name == "workspace.move" and .requiredPermissions == ["WRITE"] and .requiresConfirmation == true) and any(.tools[]; .name == "workspace.delete" and .requiredPermissions == ["DELETE"] and .requiresConfirmation == true)' >/dev/null

          text_tool=$(curl -fsS http://127.0.0.1:5077/api/tools/local.text_stats)
          echo "$text_tool" | jq -e '.name == "local.text_stats" and .inputSchema.type == "object" and .inputSchema.additionalProperties == false and .inputSchema.required == ["text"]' >/dev/null

          denied_code=$(curl -sS -o /tmp/tool-denied.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.text_stats","arguments":{"text":"xin chao"},"approvedPermissions":[],"confirmed":false}')
          test "$denied_code" = "403"
          jq -e '.status == "denied" and .success == false and (.error | contains("ĐỌC"))' /tmp/tool-denied.json >/dev/null

          invalid_code=$(curl -sS -o /tmp/tool-invalid.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.text_stats","arguments":{},"approvedPermissions":["READ"],"confirmed":false}')
          test "$invalid_code" = "400"
          jq -e '.status == "invalid-input" and .success == false and (.error | contains("văn bản"))' /tmp/tool-invalid.json >/dev/null

          tool_result=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.text_stats","arguments":{"text":"Xin chào\nAI cá nhân"},"approvedPermissions":["read"],"confirmed":false}')
          echo "$tool_result" | jq -e '.status == "succeeded" and .success == true and .toolName == "local.text_stats" and .output.wordCount == 5 and .output.lineCount == 2 and .approvedPermissions == ["READ"] and .requiredPermissions == ["READ"]' >/dev/null

          clock_result=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.clock","arguments":{},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$clock_result" | jq -e '.status == "succeeded" and .success == true and (.output.utcNow | length) > 10 and (.output.timeZoneId | length) > 0' >/dev/null

          calculator_result=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.calculate","arguments":{"expression":"2 + 3 * (4 - 1)"},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$calculator_result" | jq -e '.status == "succeeded" and .output.result == 11 and .output.resultText == "11"' >/dev/null

          calculator_invalid_code=$(curl -sS -o /tmp/calculator-invalid.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.calculate","arguments":{"expression":"10 / 0"},"approvedPermissions":["READ"],"confirmed":false}')
          test "$calculator_invalid_code" = "400"
          jq -e '.status == "invalid-input" and (.error | contains("0"))' /tmp/calculator-invalid.json >/dev/null

          date_result=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.date_math","arguments":{"operation":"add","start":"2026-09-18T00:00:00Z","days":1,"hours":2},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$date_result" | jq -e '.status == "succeeded" and (.output.result | startswith("2026-09-19T02:00:00"))' >/dev/null

          invalid_proposal_code=$(curl -sS -o /tmp/tool-proposal-invalid.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/prepare \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.not_registered","arguments":{},"reason":"invalid"}')
          test "$invalid_proposal_code" = "400"
          jq -e '(.error | contains("danh mục công cụ"))' /tmp/tool-proposal-invalid.json >/dev/null

          invalid_args_proposal_code=$(curl -sS -o /tmp/tool-proposal-invalid-args.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/prepare \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.calculate","arguments":{},"reason":"missing expression"}')
          test "$invalid_args_proposal_code" = "400"
          jq -e '(.error | contains("biểu thức"))' /tmp/tool-proposal-invalid-args.json >/dev/null

          read_proposal=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/orchestrate/prepare \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"local.calculate","arguments":{"expression":"7 * 6"},"reason":"Cần tính toán","assistantMessage":"Tôi đề xuất dùng máy tính local."}')
          echo "$read_proposal" | jq -e '.toolName == "local.calculate" and .requiredPermissions == ["READ"] and .requiresConfirmation == false and .planningMode == "manual" and .planningProvider == null and (.proposalId | length) > 20' >/dev/null
          read_proposal_id=$(echo "$read_proposal" | jq -r '.proposalId')

          read_execution=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/orchestrate/execute \
            -H 'Content-Type: application/json' \
            -d '{"proposalId":"'"$read_proposal_id"'","confirmed":false}')
          echo "$read_execution" | jq -e '.proposal.toolName == "local.calculate" and .execution.status == "succeeded" and .execution.output.result == 42 and .execution.approvedPermissions == ["READ"] and .localSummary == "7 * 6 = 42." and .canAiSynthesize == true and (.synthesisExpiresAt | length) > 10 and .canNativeContinue == false and .nativeContinueExpiresAt == null' >/dev/null
          read_invocation_id=$(echo "$read_execution" | jq -r '.execution.invocationId')

          synth_without_confirmation_code=$(curl -sS -o /tmp/tool-synth-unconfirmed.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/synthesize \
            -H 'Content-Type: application/json' \
            -d '{"invocationId":"'"$read_invocation_id"'","confirmedExternal":false}')
          test "$synth_without_confirmation_code" = "403"
          jq -e '(.error | contains("gửi kết quả công cụ")) and (.error | contains("xác nhận"))' /tmp/tool-synth-unconfirmed.json >/dev/null

          unknown_synth_code=$(curl -sS -o /tmp/tool-synth-missing.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/synthesize \
            -H 'Content-Type: application/json' \
            -d '{"invocationId":"00000000-0000-0000-0000-000000000001","confirmedExternal":false}')
          test "$unknown_synth_code" = "404"

          manual_native_code=$(curl -sS -o /tmp/tool-native-manual.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/continue-native \
            -H 'Content-Type: application/json' \
            -d '{"invocationId":"'"$read_invocation_id"'","confirmedExternal":false}')
          test "$manual_native_code" = "400"
          jq -e '(.error | contains("ngữ cảnh gọi hàm gốc"))' /tmp/tool-native-manual.json >/dev/null

          unknown_native_code=$(curl -sS -o /tmp/tool-native-missing.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/continue-native \
            -H 'Content-Type: application/json' \
            -d '{"invocationId":"00000000-0000-0000-0000-000000000002","confirmedExternal":true}')
          test "$unknown_native_code" = "404"

          read_replay_code=$(curl -sS -o /tmp/tool-proposal-replay.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/execute \
            -H 'Content-Type: application/json' \
            -d '{"proposalId":"'"$read_proposal_id"'","confirmed":false}')
          test "$read_replay_code" = "404"

          write_proposal=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/orchestrate/prepare \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.create_directory","arguments":{"path":"orchestrated"},"reason":"Tạo thư mục thử nghiệm"}')
          echo "$write_proposal" | jq -e '.toolName == "workspace.create_directory" and .requiredPermissions == ["WRITE"] and .requiresConfirmation == true' >/dev/null
          write_proposal_id=$(echo "$write_proposal" | jq -r '.proposalId')

          proposal_write_denied_code=$(curl -sS -o /tmp/tool-proposal-write-denied.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/execute \
            -H 'Content-Type: application/json' \
            -d '{"proposalId":"'"$write_proposal_id"'","confirmed":false}')
          test "$proposal_write_denied_code" = "403"
          jq -e '.execution.status == "denied" and (.execution.error | contains("xác nhận"))' /tmp/tool-proposal-write-denied.json >/dev/null
          test ! -e /tmp/personalai-workspace/orchestrated

          proposal_write_execution=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/orchestrate/execute \
            -H 'Content-Type: application/json' \
            -d '{"proposalId":"'"$write_proposal_id"'","confirmed":true}')
          echo "$proposal_write_execution" | jq -e '.execution.status == "succeeded" and .execution.output.path == "orchestrated" and .execution.output.created == true and .execution.approvedPermissions == ["WRITE"] and .localSummary == "Đã tạo thư mục orchestrated." and .canAiSynthesize == true' >/dev/null
          test -d /tmp/personalai-workspace/orchestrated

          delete_proposal=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/orchestrate/prepare \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.delete","arguments":{"path":"orchestrated"},"reason":"Dọn thư mục thử nghiệm"}')
          echo "$delete_proposal" | jq -e '.requiredPermissions == ["DELETE"] and .requiresConfirmation == true' >/dev/null
          delete_proposal_id=$(echo "$delete_proposal" | jq -r '.proposalId')

          proposal_delete_denied_code=$(curl -sS -o /tmp/tool-proposal-delete-denied.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/orchestrate/execute \
            -H 'Content-Type: application/json' \
            -d '{"proposalId":"'"$delete_proposal_id"'","confirmed":false}')
          test "$proposal_delete_denied_code" = "403"
          test -d /tmp/personalai-workspace/orchestrated

          proposal_delete_execution=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/orchestrate/execute \
            -H 'Content-Type: application/json' \
            -d '{"proposalId":"'"$delete_proposal_id"'","confirmed":true}')
          echo "$proposal_delete_execution" | jq -e '.execution.status == "succeeded" and .execution.output.path == "orchestrated" and .execution.output.deleted == true and .execution.approvedPermissions == ["DELETE"] and (.localSummary | contains("Đã xóa")) and .canAiSynthesize == true' >/dev/null
          test ! -e /tmp/personalai-workspace/orchestrated

          workspace_list=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.list","arguments":{"path":".","maxEntries":20},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$workspace_list" | jq -e '.status == "succeeded" and .output.path == "." and .output.blockedSymlinks == 1 and any(.output.entries[]; .path == "notes" and .type == "directory") and any(.output.entries[]; .path == "readme.txt" and .type == "file")' >/dev/null

          workspace_read=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.read_text","arguments":{"path":"notes/plan.md","maxCharacters":12},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$workspace_read" | jq -e '.status == "succeeded" and .output.path == "notes/plan.md" and .output.returnedCharacterCount == 12 and .output.characterCount > .output.returnedCharacterCount and .output.truncated == true and (.output.content | startswith("Workspace"))' >/dev/null

          write_unconfirmed_code=$(curl -sS -o /tmp/workspace-write-unconfirmed.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.write_text","arguments":{"path":"drafts/note.txt","content":"Draft","mode":"create"},"approvedPermissions":["WRITE"],"confirmed":false}')
          test "$write_unconfirmed_code" = "403"
          jq -e '.status == "denied" and (.error | contains("xác nhận"))' /tmp/workspace-write-unconfirmed.json >/dev/null

          write_missing_permission_code=$(curl -sS -o /tmp/workspace-write-permission.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.write_text","arguments":{"path":"drafts/note.txt","content":"Draft","mode":"create"},"approvedPermissions":["READ"],"confirmed":true}')
          test "$write_missing_permission_code" = "403"
          jq -e '.status == "denied" and (.error | contains("GHI"))' /tmp/workspace-write-permission.json >/dev/null

          workspace_mkdir=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.create_directory","arguments":{"path":"drafts"},"approvedPermissions":["WRITE"],"confirmed":true}')
          echo "$workspace_mkdir" | jq -e '.status == "succeeded" and .output.path == "drafts" and .output.created == true and .requiredPermissions == ["WRITE"]' >/dev/null

          workspace_create=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.write_text","arguments":{"path":"drafts/note.txt","content":"First line.","mode":"create"},"approvedPermissions":["WRITE"],"confirmed":true}')
          echo "$workspace_create" | jq -e '.status == "succeeded" and .output.path == "drafts/note.txt" and .output.mode == "create" and .output.created == true and .output.bytesWritten > 0 and (.output.sha256 | length) == 64 and .approvedPermissions == ["WRITE"]' >/dev/null
          create_hash=$(echo "$workspace_create" | jq -r '.output.sha256')

          created_read=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.read_text","arguments":{"path":"drafts/note.txt"},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$created_read" | jq -e '.status == "succeeded" and .output.content == "First line."' >/dev/null

          append_payload=$(jq -nc --arg hash "$create_hash" '{toolName:"workspace.write_text",arguments:{path:"drafts/note.txt",content:"\nSecond line.",mode:"append",expectedSha256:$hash},approvedPermissions:["WRITE"],confirmed:true}')
          workspace_append=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' -d "$append_payload")
          echo "$workspace_append" | jq -e '.status == "succeeded" and .output.mode == "append" and .output.created == false and .output.previousSha256 != .output.sha256 and (.output.sha256 | length) == 64' >/dev/null
          append_hash=$(echo "$workspace_append" | jq -r '.output.sha256')

          stale_payload=$(jq -nc --arg hash "$create_hash" '{toolName:"workspace.write_text",arguments:{path:"drafts/note.txt",content:"stale overwrite","mode":"overwrite",expectedSha256:$hash},approvedPermissions:["WRITE"],confirmed:true}')
          stale_code=$(curl -sS -o /tmp/workspace-stale.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' -d "$stale_payload")
          test "$stale_code" = "400"
          jq -e '.status == "invalid-input" and (.error | contains("SHA-256"))' /tmp/workspace-stale.json >/dev/null

          overwrite_payload=$(jq -nc --arg hash "$append_hash" '{toolName:"workspace.write_text",arguments:{path:"drafts/note.txt",content:"Replaced safely.","mode":"overwrite",expectedSha256:$hash},approvedPermissions:["WRITE"],confirmed:true}')
          workspace_overwrite=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' -d "$overwrite_payload")
          echo "$workspace_overwrite" | jq -e '.status == "succeeded" and .output.mode == "overwrite" and .output.created == false and .output.previousSha256 != .output.sha256' >/dev/null

          overwritten_read=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.read_text","arguments":{"path":"drafts/note.txt"},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$overwritten_read" | jq -e '.status == "succeeded" and .output.content == "Replaced safely."' >/dev/null

          overwrite_hash=$(echo "$workspace_overwrite" | jq -r '.output.sha256')

          move_unconfirmed_code=$(curl -sS -o /tmp/workspace-move-unconfirmed.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.move","arguments":{"sourcePath":"drafts/note.txt","destinationPath":"drafts/renamed.txt"},"approvedPermissions":["WRITE"],"confirmed":false}')
          test "$move_unconfirmed_code" = "403"
          jq -e '.status == "denied" and (.error | contains("xác nhận"))' /tmp/workspace-move-unconfirmed.json >/dev/null

          move_stale_payload=$(jq -nc --arg hash "$append_hash" '{toolName:"workspace.move",arguments:{sourcePath:"drafts/note.txt",destinationPath:"drafts/renamed.txt",expectedSha256:$hash},approvedPermissions:["WRITE"],confirmed:true}')
          move_stale_code=$(curl -sS -o /tmp/workspace-move-stale.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' -d "$move_stale_payload")
          test "$move_stale_code" = "400"
          jq -e '.status == "invalid-input" and (.error | contains("SHA-256"))' /tmp/workspace-move-stale.json >/dev/null

          move_payload=$(jq -nc --arg hash "$overwrite_hash" '{toolName:"workspace.move",arguments:{sourcePath:"drafts/note.txt",destinationPath:"drafts/renamed.txt",expectedSha256:$hash},approvedPermissions:["WRITE"],confirmed:true}')
          workspace_move=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' -d "$move_payload")
          echo "$workspace_move" | jq -e '.status == "succeeded" and .output.sourcePath == "drafts/note.txt" and .output.destinationPath == "drafts/renamed.txt" and .output.type == "file" and .output.sha256 == "'"$overwrite_hash"'"' >/dev/null

          moved_read=$(curl -fsS -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.read_text","arguments":{"path":"drafts/renamed.txt"},"approvedPermissions":["READ"],"confirmed":false}')
          echo "$moved_read" | jq -e '.status == "succeeded" and .output.content == "Replaced safely."' >/dev/null

          delete_unconfirmed_code=$(curl -sS -o /tmp/workspace-delete-unconfirmed.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.delete","arguments":{"path":"drafts/renamed.txt"},"approvedPermissions":["DELETE"],"confirmed":false}')
          test "$delete_unconfirmed_code" = "403"
          jq -e '.status == "denied" and (.error | contains("xác nhận"))' /tmp/workspace-delete-unconfirmed.json >/dev/null

          delete_permission_code=$(curl -sS -o /tmp/workspace-delete-permission.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.delete","arguments":{"path":"drafts/renamed.txt"},"approvedPermissions":["WRITE"],"confirmed":true}')
          test "$delete_permission_code" = "403"
          jq -e '.status == "denied" and (.error | contains("XÓA"))' /tmp/workspace-delete-permission.json >/dev/null

          delete_stale_payload=$(jq -nc --arg hash "$append_hash" '{toolName:"workspace.delete",arguments:{path:"drafts/renamed.txt",expectedSha256:$hash},approvedPermissions:["DELETE"],confirmed:true}')
          delete_stale_code=$(curl -sS -o /tmp/workspace-delete-stale.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' -d "$delete_stale_payload")
          test "$delete_stale_code" = "400"
          jq -e '.status == "invalid-input" and (.error | contains("SHA-256"))' /tmp/workspace-delete-stale.json >/dev/null

          nonempty_delete_code=$(curl -sS -o /tmp/workspace-delete-nonempty.json -w '%{http_code}' -X POST http://127.0.0.1:5077/api/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"toolName":"workspace.delete","arguments":{"path":"notes"},"approvedPermissions":["DELETE"],"confirmed":true}')
          test "$nonempty_delete_code" = "400"
          jq -e '.status == "invalid-input" and (.error | contains("không hỗ trợ xóa đệ quy"))' /tmp/workspace-delete-nonempty.json >/dev/null

