name: Kiểm tra chốt điều khiển máy tính trên Windows

on:
  push:
    branches:
      - feature/desktop-gap-audit-and-control-stop
      - feature/desktop-manual-mouse-actions
      - feature/desktop-session-limits
      - feature/desktop-windows-stop-hotkey
      - feature/desktop-notepad-keyboard-preview
  pull_request:
    paths:
      - 'src/PersonalAI.Web/Services/ComputerUse*'
      - 'src/PersonalAI.Web/Services/ComputerClickLeftTool.cs'
      - 'src/PersonalAI.Web/Services/ComputerControlGate.cs'
      - 'src/PersonalAI.Web/Services/WindowsStopHotkeyService.cs'
      - 'src/PersonalAI.Web/Models/ComputerUseModels.cs'
      - '.github/workflows/desktop-control.yml'

jobs:
  kiem-tra-windows:
    runs-on: windows-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
      - name: Cài đặt .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Biên dịch ứng dụng
        run: dotnet build PersonalAI.sln --configuration Release

      - name: Kiểm tra khóa mặc định và dừng trên Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "http://127.0.0.1:5099"
          $app = Start-Process dotnet -ArgumentList @(
            "run", "--project", "src/PersonalAI.Web/PersonalAI.Web.csproj",
            "--configuration", "Release", "--no-build", "--no-launch-profile",
            "--urls", $base
          ) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $status = Invoke-RestMethod "$base/api/computer/status" -TimeoutSec 2
                $ready = $true
                break
              } catch { }
            }
            if (-not $ready) { throw "Ứng dụng không khởi động trong thời gian chờ." }
            if (-not $status.supported) { throw "Windows chưa được nhận diện." }
            if ($status.desktopActionsPaused -ne $true) { throw "Điều khiển không khóa khi khởi động." }
            # Lệnh nhập mẫu không được gửi khi đang tạm dừng; CI không gõ ký tự thật.
            $keyboardBody = @{ windowId = "0x0"; text = "thu nghiem" } | ConvertTo-Json
            $keyboardWithoutApproval = Invoke-WebRequest "$base/api/computer/keyboard/type-notepad" -Method Post -ContentType "application/json" -Body $keyboardBody -SkipHttpErrorCheck
            if ($keyboardWithoutApproval.StatusCode -ne 403) { throw "Nhập Notepad chưa xác nhận không bị từ chối." }
            $keyboardWhilePaused = Invoke-WebRequest "$base/api/computer/keyboard/type-notepad" -Method Post -ContentType "application/json" -Body $keyboardBody -Headers @{ "X-PersonalAI-Manual-Approval" = "dong-y" } -SkipHttpErrorCheck
            $keyboardResult = $keyboardWhilePaused.Content | ConvertFrom-Json
            if ($keyboardWhilePaused.StatusCode -ne 400 -or $keyboardResult.error -notmatch "tạm dừng") {
              throw "Nhập Notepad vẫn hoạt động khi đang dừng."
            }

            if ($status.stopHotkey -ne "Ctrl + Shift + F12") { throw "Thông báo tổ hợp phím dừng không đúng." }
            if ($status.desktopRemainingActions -ne 0 -or $null -ne $status.desktopSessionExpiresAt) {
              throw "Khi khởi động vẫn có lượt điều khiển hoặc thời hạn phiên."
            }

            $stop = Invoke-RestMethod "$base/api/computer/control/stop" -Method Post
            if ($stop.paused -ne $true) { throw "Không tạm dừng được điều khiển." }

            $notApproved = Invoke-WebRequest "$base/api/computer/control/enable" -Method Post -SkipHttpErrorCheck
            if ($notApproved.StatusCode -ne 403) { throw "Thiếu xác nhận nhưng vẫn cho phép điều khiển." }

            $toolBody = @{
              toolName = "computer.cursor.move"
              arguments = @{ x = 0; y = 0 }
              approvedPermissions = @("WRITE", "COMPUTER")
              confirmed = $true
            } | ConvertTo-Json -Depth 5
            $blockedTool = Invoke-WebRequest "$base/api/tools/execute" -Method Post -ContentType "application/json" -Body $toolBody -SkipHttpErrorCheck
            $blocked = $blockedTool.Content | ConvertFrom-Json
            if ($blockedTool.StatusCode -ne 400 -or $blocked.status -ne "invalid-input" -or $blocked.error -notmatch "tạm dừng") {
              throw "Công cụ điều khiển không tuân thủ trạng thái dừng."
            }

            $mouseBody = @{
              toolName = "computer.mouse.click-left"
              arguments = @{ windowId = "0x1234"; x = 0; y = 0 }
              approvedPermissions = @("WRITE", "COMPUTER", "SENSITIVE")
              confirmed = $true
            } | ConvertTo-Json -Depth 5
            $blockedMouse = Invoke-WebRequest "$base/api/tools/execute" -Method Post -ContentType "application/json" -Body $mouseBody -SkipHttpErrorCheck
            $mouseResult = $blockedMouse.Content | ConvertFrom-Json
            if ($blockedMouse.StatusCode -ne 400 -or $mouseResult.status -ne "invalid-input" -or $mouseResult.error -notmatch "tạm dừng") {
              throw "Nhấp chuột vẫn được phép khi hệ thống đang dừng."
            }
            $mouseBodyUnconfirmed = @{
              toolName = "computer.mouse.click-left"
              arguments = @{ windowId = "0x1234"; x = 0; y = 0 }
              approvedPermissions = @("WRITE", "COMPUTER", "SENSITIVE")
              confirmed = $false
            } | ConvertTo-Json -Depth 5
            $unconfirmedMouse = Invoke-WebRequest "$base/api/tools/execute" -Method Post -ContentType "application/json" -Body $mouseBodyUnconfirmed -SkipHttpErrorCheck
            if ($unconfirmedMouse.StatusCode -ne 403) { throw "Cho nhấp chuột khi chưa có xác nhận riêng." }

            if ($status.interactiveSession -and $status.stopHotkeyAvailable -eq $true) {
              $enabled = Invoke-RestMethod "$base/api/computer/control/enable" -Method Post -Headers @{ "X-PersonalAI-Manual-Approval" = "dong-y" }
              if ($enabled.paused -ne $false) { throw "Không cho phép lại trong phiên Windows tương tác." }
              if ($enabled.remainingActions -ne 5 -or $null -eq $enabled.expiresAt) {
                throw "Phiên điều khiển không giới hạn 5 thao tác và 60 giây."
              }
              $sessionBefore = Invoke-RestMethod "$base/api/computer/status"
              if ($sessionBefore.desktopActionsPaused -ne $false -or $sessionBefore.desktopRemainingActions -ne 5) {
                throw "API trạng thái không công bố ngân sách phiên."
              }
              # Dùng ID cửa sổ không tồn tại: mỗi thao tác tiêu tốn một lượt mà không nhấp máy thật.
              $badWindow = @{
                toolName = "computer.window.focus"
                arguments = @{ windowId = "0x0" }
                approvedPermissions = @("WRITE", "COMPUTER", "SENSITIVE")
                confirmed = $true
              } | ConvertTo-Json -Depth 5
              for ($i = 0; $i -lt 5; $i++) {
                $failed = Invoke-WebRequest "$base/api/tools/execute" -Method Post -ContentType "application/json" -Body $badWindow -SkipHttpErrorCheck
                if ($failed.StatusCode -ne 400) { throw "Lệnh thử cửa sổ không hợp lệ vẫn được thực thi." }
              }
              $exhausted = Invoke-RestMethod "$base/api/computer/status"
              if ($exhausted.desktopActionsPaused -ne $true -or $exhausted.desktopRemainingActions -ne 0) {
                throw "Không tự khóa khi dùng hết 5 lượt."
              }
              $blockedAfterLimit = Invoke-WebRequest "$base/api/tools/execute" -Method Post -ContentType "application/json" -Body $badWindow -SkipHttpErrorCheck
              $blockedAfterLimitMessage = $blockedAfterLimit.Content | ConvertFrom-Json
              if ($blockedAfterLimit.StatusCode -ne 400 -or $blockedAfterLimitMessage.error -notmatch "tạm dừng") {
                throw "Lệnh điều khiển vẫn đi qua khi đã hết lượt."
              }
              $stoppedAgain = Invoke-RestMethod "$base/api/computer/control/stop" -Method Post
              if ($stoppedAgain.paused -ne $true) { throw "Không dừng lại được sau khi cho phép." }
            }
            if ($status.interactiveSession -and $status.stopHotkeyAvailable -ne $true) {
              $noHotkey = Invoke-WebRequest "$base/api/computer/control/enable" -Method Post -Headers @{ "X-PersonalAI-Manual-Approval" = "dong-y" } -SkipHttpErrorCheck
              if ($noHotkey.StatusCode -ne 400) { throw "Không có phím dừng nhưng vẫn cho bật điều khiển." }
              $afterDenied = Invoke-RestMethod "$base/api/computer/status"
              if ($afterDenied.desktopActionsPaused -ne $true) { throw "Thất bại khi đăng ký phím nhưng hệ thống không khóa." }
            }
            Write-Host "Đạt: khóa mặc định, dừng, từ chối thiếu xác nhận và từ chối lệnh khi dừng."
          } finally {
            if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
