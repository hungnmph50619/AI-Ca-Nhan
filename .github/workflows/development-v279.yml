name: Development v2.7.9

on:
  push:
    branches:
      - 'experiment/roadmap-v2-7-9-current'

jobs:
  validate-v279:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PersonalAI.sln

      - name: Build
        run: dotnet build PersonalAI.sln -c Release --no-restore

      - name: Tests
        run: dotnet test PersonalAI.sln -c Release --no-build

      - name: Merge policy smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/personalai-v279
          mkdir -p             /tmp/personalai-v279/workspace             /tmp/personalai-v279/runs             /tmp/personalai-v279/reviews             /tmp/personalai-v279/security             /tmp/personalai-v279/benchmarks             /tmp/personalai-v279/github             /tmp/personalai-v279/ci             /tmp/personalai-v279/policy             /tmp/personalai-v279/credentials

          cat > /tmp/personalai-v279/fake_github.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json, pathlib

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  return

              def _json(self, code, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_PUT(self):
                  if self.path == "/repos/owner/repo/pulls/79/merge":
                      length = int(self.headers.get("Content-Length", "0"))
                      self.rfile.read(length)
                      pathlib.Path("/tmp/personalai-v279/merge-called").write_text("yes")
                      self._json(200, {
                          "merged": True,
                          "sha": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                      })
                  else:
                      self._json(404, {"message":"not found"})

          HTTPServer(("127.0.0.1", 6124), Handler).serve_forever()
          PY

          python3 /tmp/personalai-v279/fake_github.py >/tmp/personalai-v279/fake.log 2>&1 &
          FAKE_PID=$!

          export Workspace__Root=/tmp/personalai-v279/workspace
          export Development__RunRoot=/tmp/personalai-v279/runs
          export Development__ReviewRoot=/tmp/personalai-v279/reviews
          export Development__SecurityReportRoot=/tmp/personalai-v279/security
          export Development__BenchmarkRoot=/tmp/personalai-v279/benchmarks
          export Development__GitHubReportRoot=/tmp/personalai-v279/github
          export Development__CiRoot=/tmp/personalai-v279/ci
          export Development__MergePolicyRoot=/tmp/personalai-v279/policy
          export Development__CredentialRoot=/tmp/personalai-v279/credentials
          export Development__GitHubApiBaseUrl=http://127.0.0.1:6124

          dotnet run --project src/PersonalAI.Web/PersonalAI.Web.csproj             -c Release --no-build             --urls http://127.0.0.1:5114             >/tmp/personalai-v279/app.log 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            kill "$FAKE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5114/api/development/merge-policy/status >/tmp/status.json; then
              break
            fi
            sleep 1
          done

          jq -e '
            .version=="2.7.9"
            and .lowRiskAutoMergeEnabled==true
            and .highRiskAutoMergeAllowed==false
            and .highRiskRequiresUserConfirmation==true
            and (.requiredChecks | sort)==(["benchmark","ci","pull-request","review","security"] | sort)
          ' /tmp/status.json >/dev/null

          curl -fsS -X POST http://127.0.0.1:5114/api/development/git-credentials             -H 'Content-Type: application/json'             -d '{
              "name":"v279-token",
              "kind":"https-token",
              "secret":"ghp_V279DUMMYTOKEN012345678901234567890",
              "username":"x-access-token",
              "confirmStoreCredential":true
            }' >/tmp/credential.json
          credential_ref=$(jq -r '.credentialRef' /tmp/credential.json)

          curl -fsS -X POST http://127.0.0.1:5114/api/development/runs             -H 'Content-Type: application/json'             -d '{
              "goal":"v2.7.9 merge policy smoke",
              "repositoryPath":"",
              "branch":"experiment/v279-smoke",
              "confirmCreate":true
            }' >/tmp/run.json

          run_id=$(jq -r '.id' /tmp/run.json)
          workspace_id=$(jq -r '.workspaceId' /tmp/run.json)
          safe_workspace=$(printf '%s' "$workspace_id" | sed 's/[^A-Za-z0-9_-]/_/g')

          for transition in             'analysis prepared'             'coding succeeded'             'testing passed'             'review approved'; do
            set -- $transition
            curl -fsS -X POST http://127.0.0.1:5114/api/development/runs/$run_id/advance               -H 'Content-Type: application/json'               -d '{"expectedCurrentStage":"'"$1"'","result":"'"$2"'"}' >/tmp/advance.json
          done

          review_id='11111111-1111-1111-1111-111111111111'
          security_id='22222222-2222-2222-2222-222222222222'
          benchmark_id='33333333-3333-3333-3333-333333333333'
          github_id='44444444-4444-4444-4444-444444444444'
          ci_id='55555555-5555-5555-5555-555555555555'

          cat > /tmp/personalai-v279/reviews/development-review-reports-$safe_workspace.json <<JSON
          [{
            "id":"$review_id",
            "workspaceId":"$workspace_id",
            "developmentRunId":"$run_id",
            "testReportId":"aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa",
            "repositoryPath":"",
            "branch":"experiment/v279-smoke",
            "worktreePath":".personalai-worktrees/v279",
            "codingAgentId":"coding.agent",
            "reviewerId":"quality.reviewer",
            "checks":[
              {"category":"correctness","status":"passed","detail":"seed"},
              {"category":"architecture","status":"passed","detail":"seed"},
              {"category":"regression","status":"passed","detail":"seed"}
            ],
            "status":"approved",
            "approved":true,
            "independentReviewer":true,
            "createdAt":"2026-10-01T00:00:00+00:00"
          }]
          JSON

          cat > /tmp/personalai-v279/security/development-security-reports-$safe_workspace.json <<JSON
          [{
            "id":"$security_id",
            "workspaceId":"$workspace_id",
            "developmentRunId":"$run_id",
            "reviewReportId":"$review_id",
            "repositoryPath":"",
            "branch":"experiment/v279-smoke",
            "worktreePath":".personalai-worktrees/v279",
            "findings":[],
            "checkedCategories":["secret-leakage","permission-bypass","injection","path-traversal","dangerous-execution"],
            "highRiskFound":false,
            "promotionAllowed":true,
            "createdAt":"2026-10-01T00:00:00+00:00"
          }]
          JSON

          cat > /tmp/personalai-v279/benchmarks/development-benchmark-reports-$safe_workspace.json <<JSON
          [{
            "id":"$benchmark_id",
            "workspaceId":"$workspace_id",
            "developmentRunId":"$run_id",
            "gates":[
              {"gate":"rag","passed":true,"observed":1,"threshold":0.8,"detail":"seed"},
              {"gate":"tool","passed":true,"observed":1,"threshold":0.8,"detail":"seed"},
              {"gate":"task","passed":true,"observed":1,"threshold":0.8,"detail":"seed"},
              {"gate":"agent","passed":true,"observed":1,"threshold":0.8,"detail":"seed"},
              {"gate":"performance","passed":true,"observed":10,"threshold":30000,"detail":"seed"},
              {"gate":"resource","passed":true,"observed":1000000,"threshold":2147483648,"detail":"seed"}
            ],
            "evaluatedCases":4,
            "failedCases":0,
            "passed":true,
            "durationMs":10,
            "workingSetBytes":1000000,
            "startedAt":"2026-10-01T00:00:00+00:00",
            "completedAt":"2026-10-01T00:00:01+00:00"
          }]
          JSON

          cat > /tmp/personalai-v279/github/development-github-reports-$safe_workspace.json <<JSON
          [{
            "id":"$github_id",
            "workspaceId":"$workspace_id",
            "developmentRunId":"$run_id",
            "repository":"owner/repo",
            "branch":"experiment/v279-smoke",
            "baseBranch":"main",
            "worktreePath":".personalai-worktrees/v279",
            "remote":"origin",
            "pushed":true,
            "pullRequestCreated":true,
            "pullRequestNumber":79,
            "pullRequestUrl":"https://example.invalid/owner/repo/pull/79",
            "ciRunId":"$ci_id",
            "ciState":"completed",
            "ciConclusion":"success",
            "ciRepairAttempts":0,
            "maximumCiRepairAttempts":3,
            "createdAt":"2026-10-01T00:00:00+00:00",
            "updatedAt":"2026-10-01T00:01:00+00:00"
          }]
          JSON

          cat > /tmp/personalai-v279/ci/ci-runs-$safe_workspace.json <<JSON
          [{
            "id":"$ci_id",
            "workspaceId":"$workspace_id",
            "repository":"owner/repo",
            "sourceEventType":"workflow_run",
            "deliveryId":"delivery-v279",
            "externalId":"279001",
            "ref":"experiment/v279-smoke",
            "sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "state":"completed",
            "conclusion":"success",
            "repairAttempts":0,
            "maximumRepairAttempts":3,
            "failureLogExcerpt":null,
            "failureLogTruncated":false,
            "firstSeenAt":"2026-10-01T00:00:00+00:00",
            "updatedAt":"2026-10-01T00:01:00+00:00",
            "completedAt":"2026-10-01T00:01:00+00:00"
          }]
          JSON

          curl -fsS -X POST http://127.0.0.1:5114/api/development/runs/$run_id/advance             -H 'Content-Type: application/json'             -d '{
              "expectedCurrentStage":"security",
              "result":"passed",
              "securityReportId":"'"$security_id"'"
            }' >/tmp/benchmark-stage.json

          curl -fsS -X POST http://127.0.0.1:5114/api/development/runs/$run_id/advance             -H 'Content-Type: application/json'             -d '{
              "expectedCurrentStage":"benchmark",
              "result":"passed",
              "benchmarkReportId":"'"$benchmark_id"'"
            }' >/tmp/push-stage.json

          curl -fsS -X POST http://127.0.0.1:5114/api/development/runs/$run_id/advance             -H 'Content-Type: application/json'             -d '{
              "expectedCurrentStage":"push",
              "result":"succeeded",
              "gitHubReportId":"'"$github_id"'"
            }' >/tmp/ci-stage.json

          curl -fsS -X POST http://127.0.0.1:5114/api/development/runs/$run_id/advance             -H 'Content-Type: application/json'             -d '{
              "expectedCurrentStage":"ci",
              "result":"passed",
              "ciRunId":"'"$ci_id"'"
            }' >/tmp/merge-policy-stage.json
          jq -e '.stage=="merge-policy"' /tmp/merge-policy-stage.json >/dev/null

          curl -fsS -X POST http://127.0.0.1:5114/api/development/merge-policy/evaluate             -H 'Content-Type: application/json'             -d '{
              "developmentRunId":"'"$run_id"'",
              "gitHubReportId":"'"$github_id"'",
              "reviewReportId":"'"$review_id"'",
              "securityReportId":"'"$security_id"'",
              "benchmarkReportId":"'"$benchmark_id"'",
              "ciRunId":"'"$ci_id"'",
              "riskLevel":"high",
              "riskEvidence":"high-impact change requires user approval",
              "credentialRef":"'"$credential_ref"'",
              "allowAutomaticMerge":true,
              "confirmNonLowRiskMerge":false
            }' >/tmp/high-risk.json

          high_report_id=$(jq -r '.id' /tmp/high-risk.json)
          jq -e '
            .allRequiredChecksPassed==true
            and .automaticMergeEligible==false
            and .requiresUserConfirmation==true
            and .mergeAttempted==false
            and .merged==false
            and .decision=="requires-user-confirmation"
          ' /tmp/high-risk.json >/dev/null
          test ! -f /tmp/personalai-v279/merge-called

          blocked=$(curl -sS -o /tmp/local-sync-blocked.json -w '%{http_code}'             -X POST http://127.0.0.1:5114/api/development/runs/$run_id/advance             -H 'Content-Type: application/json'             -d '{
              "expectedCurrentStage":"merge-policy",
              "result":"approved",
              "mergePolicyReportId":"'"$high_report_id"'"
            }')
          test "$blocked" = "409"

          curl -fsS -X POST http://127.0.0.1:5114/api/development/merge-policy/evaluate             -H 'Content-Type: application/json'             -d '{
              "developmentRunId":"'"$run_id"'",
              "gitHubReportId":"'"$github_id"'",
              "reviewReportId":"'"$review_id"'",
              "securityReportId":"'"$security_id"'",
              "benchmarkReportId":"'"$benchmark_id"'",
              "ciRunId":"'"$ci_id"'",
              "riskLevel":"low",
              "riskEvidence":"isolated low-risk change with all gates passed",
              "credentialRef":"'"$credential_ref"'",
              "allowAutomaticMerge":true,
              "confirmNonLowRiskMerge":false
            }' >/tmp/low-risk.json

          low_report_id=$(jq -r '.id' /tmp/low-risk.json)
          jq -e '
            .allRequiredChecksPassed==true
            and .automaticMergeEligible==true
            and .requiresUserConfirmation==false
            and .mergeAttempted==true
            and .merged==true
            and .decision=="merged"
            and .mergeCommitSha=="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          ' /tmp/low-risk.json >/dev/null
          test -f /tmp/personalai-v279/merge-called

          curl -fsS -X POST http://127.0.0.1:5114/api/development/runs/$run_id/advance             -H 'Content-Type: application/json'             -d '{
              "expectedCurrentStage":"merge-policy",
              "result":"approved",
              "mergePolicyReportId":"'"$low_report_id"'"
            }' >/tmp/local-sync.json

          jq -e '
            .stage=="local-sync"
            and .mergePolicyReportId=="'"$low_report_id"'"
          ' /tmp/local-sync.json >/dev/null

          policy_file=$(find /tmp/personalai-v279/policy -type f -name 'development-merge-policy-*.json' | head -n1)
          test -n "$policy_file"
          ! grep -Fq 'ghp_V279DUMMYTOKEN012345678901234567890' "$policy_file"

          curl -fsS http://127.0.0.1:5114/api/development/status             | jq -e '(.availableCapabilities | index("merge-policy")) != null' >/dev/null
