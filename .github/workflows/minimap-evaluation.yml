name: Minimap offline evaluation tests

on:
  push:
    branches:
      - 'feature/v2.3.1-minimap-evaluation'
      - 'feature/v2.3.2-minimap-evaluation-dashboard'
      - 'feature/v2.3.3-vision-opt-in-box-suggest'
      - 'feature/v2.3.4-minimap-evaluation-import'
      - 'feature/v2.3.5-minimap-sample-review'
  pull_request:

jobs:
  offline-minimap-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kiểm thử bộ đánh giá tọa độ đã xác minh
        run: python -m unittest discover -s tests -p test_minimap_eval.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm thử mã xử lý gán nhãn ngoại tuyến
        run: |
          node --check src/PersonalAI.Web/wwwroot/vision-review-core.js
          node --check src/PersonalAI.Web/wwwroot/vision-review.js
          node --test tests/vision-review-core.test.cjs
          node --test tests/vision-review-consent.test.cjs
      - name: Kiểm tra trang gán nhãn được liên kết từ Vision Lab
        run: |
          grep -Fq 'vision-review.html' src/PersonalAI.Web/wwwroot/vision.html
          grep -Fq 'vision-review-core.js' src/PersonalAI.Web/wwwroot/vision-review.html
          grep -Fq 'vision-review.js' src/PersonalAI.Web/wwwroot/vision-review.html
          grep -Fq 'qualitySummary' src/PersonalAI.Web/wwwroot/vision-review.html
          grep -Fq 'evaluateRecords' src/PersonalAI.Web/wwwroot/vision-review.js
          grep -Fq 'locateConsent' src/PersonalAI.Web/wwwroot/vision-review.html
          grep -Fq 'locateConsent.checked' src/PersonalAI.Web/wwwroot/vision-review.js
          grep -Fq 'X-Xerath-Vision' src/PersonalAI.Web/wwwroot/vision-review.js
          grep -Fq 'normalizeLocateResponse' src/PersonalAI.Web/wwwroot/vision-review-core.js
          grep -Fq 'reviewImportFile' src/PersonalAI.Web/wwwroot/vision-review.html
          grep -Fq 'importReviewedData' src/PersonalAI.Web/wwwroot/vision-review.js
          grep -Fq 'sampleReviewSelect' src/PersonalAI.Web/wwwroot/vision-review.html
          grep -Fq 'removeSampleButton' src/PersonalAI.Web/wwwroot/vision-review.js
