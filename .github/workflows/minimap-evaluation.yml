name: Minimap offline evaluation tests

on:
  push:
    branches:
      - 'feature/v2.3.1-minimap-evaluation'
  pull_request:

jobs:
  offline-minimap-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kiểm thử bộ đánh giá tọa độ đã xác minh
        run: python -m unittest discover -s tests -p test_minimap_eval.py -v
