name: Model Lab v2.5.5

on:
  push:
    branches:
      - 'experiment/roadmap-v2-5-5-current'
  pull_request:
    paths:
      - 'src/PersonalAI.Web/ModelLab/TrainingProviderModels.cs'
      - 'src/PersonalAI.Web/Services/TrainingProviderServices.cs'
      - 'src/PersonalAI.Web/Services/ModelLabEndpoints.cs'
      - 'src/PersonalAI.Web/Models/SystemModels.cs'

jobs:
  validate-v255:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PersonalAI.sln

      - name: Build
        run: dotnet build PersonalAI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PersonalAI.sln --configuration Release --no-build

      - name: Provider abstraction smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/personalai-v255
          mkdir -p /tmp/personalai-v255/workspace /tmp/personalai-v255/model-lab

          Workspace__Root=/tmp/personalai-v255/workspace           ModelLab__Root=/tmp/personalai-v255/model-lab           dotnet run --project src/PersonalAI.Web/PersonalAI.Web.csproj             --configuration Release --no-build             --urls http://127.0.0.1:5085             >/tmp/personalai-v255.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5085/api/model-lab/training/providers >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/personalai-v255.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:5085/api/model-lab/training/providers             | jq -e '
                length == 1
                and .[0].providerId == "mock"
                and .[0].externalService == false
                and .[0].supportsFullFineTune == true
                and .[0].supportsLoRa == false
                and .[0].supportsCancellation == true
                and (. [0].supportedMethods | index("full")) != null
              ' >/dev/null

          curl -fsS -X POST             http://127.0.0.1:5085/api/model-lab/training/providers/mock/validate             -H 'Content-Type: application/json'             -d '{"providerId":"ignored","baseModel":"test-model","trainingMethod":"full","hyperparameters":{"epochs":1}}'             | jq -e '
                .valid == true
                and .providerId == "mock"
                and .trainingMethod == "full"
                and (.errors | length) == 0
                and (.warnings | length) >= 1
              ' >/dev/null

          curl -fsS -X POST             http://127.0.0.1:5085/api/model-lab/training/providers/mock/validate             -H 'Content-Type: application/json'             -d '{"providerId":"mock","baseModel":"test-model","trainingMethod":"lora","hyperparameters":{}}'             | jq -e '
                .valid == false
                and (.errors | length) >= 1
              ' >/dev/null

          not_found_code=$(curl -sS -o /tmp/provider-not-found.json -w '%{http_code}'             -X POST http://127.0.0.1:5085/api/model-lab/training/providers/missing/validate             -H 'Content-Type: application/json'             -d '{"providerId":"missing","baseModel":"test","trainingMethod":"full","hyperparameters":{}}')
          test "$not_found_code" = "404"
