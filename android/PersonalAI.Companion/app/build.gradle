plugins {
    id "com.android.application"
}

android {
    namespace "com.personalai.companion"
    compileSdk 35

    defaultConfig {
        applicationId "com.personalai.companion"
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName "1.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
